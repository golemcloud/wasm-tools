[package]
name = "wit-component"
authors = ["Peter Huene <peter@huene.dev>"]
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/bytecodealliance/wasm-tools/tree/main/crates/wit-component"
homepage = "https://github.com/bytecodealliance/wasm-tools/tree/main/crates/wit-component"
documentation = "https://docs.rs/wit-component"
description = """
Tooling for working with `*.wit` and component files together.
"""
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = { workspace = true }
bitflags = "2.3.3"
indexmap = { workspace = true, features = ["std"] }
log = "0.4.17"
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
# The sibling crates come from crates.io, as in the published 0.258.3 manifest.
# A Git dependency on this crate then shares them with registry dependents
# instead of building a second copy of each from this repository.
wasm-encoder = { version = "0.258.3", default-features = false, features = ['std', 'wasmparser'] }
wasm-metadata = { version = "0.258.3", default-features = false }
wasmparser = { version = "0.258.3", default-features = false, features = ['std', 'component-model', 'simd'] }
wast = { version = "258.0.3", default-features = false, optional = true }
wat = { version = "1.258.3", default-features = false, optional = true }
wit-parser = { version = "0.258.3", features = ['decoding', 'serde'] }

[dev-dependencies]
env_logger = { workspace = true }
glob = "0.3.0"
libtest-mimic = { workspace = true }
pretty_assertions = "1.3.0"
toml = { workspace = true }
wasmparser = { version = "0.258.3", default-features = false, features = ['simd', 'std', 'component-model', 'features'] }
wasmprinter = { workspace = true, features = ['component-model'] }
wat = { version = "1.258.3", default-features = false, features = ['component-model'] }
wasm-metadata = { version = "0.258.3", default-features = false, features = ['oci'] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
wasmtime = { workspace = true }

[features]
dummy-module = ['dep:wat']
wat = ['dep:wast', 'dep:wat']
semver-check = ['dummy-module']

[[test]]
name = "components"
harness = false

[[test]]
name = "interfaces"
harness = false
